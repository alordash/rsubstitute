[workspace]
resolver = "3"
members = ["rsubstitute", "rsubstitute_core", "rsubstitute_proc_macro"]

[workspace.dependencies]
rsubstitute_core = { version = "0.1.0", path = "rsubstitute_core" }
rsubstitute_proc_macro = { version = "0.1.0", path = "rsubstitute_proc_macro" }

typeid = "1.0.3"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.3", features = ["full", "visit", "visit-mut"] }
not_enough_asserts = "1.4.1"
indexmap = "2.14.0"

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

walkdir = "2.5.0"
clap_derive = "4.6.4"
clap = { version = "4.6.5", features = ["derive"] }